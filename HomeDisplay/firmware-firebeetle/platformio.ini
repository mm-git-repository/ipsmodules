; HomeDisplay FireBeetle 2 ESP32-E + GxEPD2 (4.2" / 7.5", S/W oder 3C)
; Bibliotheken offline: papyrOSClientESP32/lib + lib/TJpg_Decoder (kein lib_deps/Registry).
[platformio]
build_dir = build

[env:dfrobot_firebeetle2_esp32e]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.partitions = default.csv
lib_extra_dirs =
  ../../../papyrOSClientESP32/lib
  lib
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DHOMEDISPLAY_FB_FIRMWARE_VERSION=\"0.2.0\"
  -DHOMEDISPLAY_FB_DEFAULT_DISPLAY_042=1
